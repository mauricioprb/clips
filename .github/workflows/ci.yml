name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  functions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [timesheet, members, user-cleanup]
    defaults:
      run:
        working-directory: functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer check-platform-reqs
      - run: composer lint
      - if: hashFiles(format('functions/{0}/tests/Unit/**', matrix.function)) != ''
        run: composer test:unit

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: sites/app/.nvmrc
          cache: npm
          cache-dependency-path: sites/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instruções só no AGENTS.md e skills só em .agents/skills
        run: |
          forbidden=$(git ls-files 'CLAUDE.md' '**/CLAUDE.md' '.cursorrules' 'GEMINI.md' '.github/copilot-instructions.md')
          stray_skills=$(git ls-files '**/SKILL.md' | grep -v '^\.agents/skills/' || true)
          if [ -n "$forbidden$stray_skills" ]; then
            echo "Arquivos fora do padrão de agentes:"
            echo "$forbidden"
            echo "$stray_skills"
            exit 1
          fi

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [functions, site, agents]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      integration-tests: true
    secrets: inherit

  deploy-prod:
    needs: deploy-dev
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
