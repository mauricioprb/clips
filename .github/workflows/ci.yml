name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  functions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [timesheet, members, user-cleanup]
    defaults:
      run:
        working-directory: functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer check-platform-reqs
      - run: composer lint
      - if: hashFiles(format('functions/{0}/tests/Unit/**', matrix.function)) != ''
        run: composer test:unit

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: sites/app/.nvmrc
          cache: npm
          cache-dependency-path: sites/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instruções só no AGENTS.md e skills só em .agents/skills
        run: |
          forbidden=$(git ls-files 'CLAUDE.md' '**/CLAUDE.md' '.cursorrules' 'GEMINI.md' '.github/copilot-instructions.md')
          stray_skills=$(git ls-files '**/SKILL.md' | grep -v '^\.agents/skills/' || true)
          if [ -n "$forbidden$stray_skills" ]; then
            echo "Arquivos fora do padrão de agentes:"
            echo "$forbidden"
            echo "$stray_skills"
            exit 1
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [functions, site, agents]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency: deploy-production
    env:
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: sites/app/.nvmrc
      - run: npm install --global appwrite-cli@28.9.0
      - run: appwrite client --endpoint "$APPWRITE_ENDPOINT" --key "$APPWRITE_API_KEY"
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}

      - name: Esquema
        run: |
          if jq -e '(.teams // []) | length > 0' appwrite.config.json > /dev/null; then
            appwrite push team --all --force
          fi
          appwrite push table --all --force

      - name: Functions
        run: appwrite push function --all --activate --force

      - name: Site
        run: |
          printf 'NUXT_PUBLIC_APPWRITE_ENDPOINT=%s\nNUXT_PUBLIC_APPWRITE_PROJECT_ID=%s\n' \
            "$APPWRITE_ENDPOINT" "$APPWRITE_PROJECT_ID" > sites/app/.env
          appwrite push site --all --activate --with-variables --force

      - name: Teste de fumaça
        run: curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 10 "${{ vars.SITE_URL }}/login"
