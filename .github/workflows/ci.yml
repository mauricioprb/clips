name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  functions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [timesheet, members, user-cleanup]
    defaults:
      run:
        working-directory: functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer check-platform-reqs
      - run: composer lint
      - if: hashFiles(format('functions/{0}/tests/Unit/**', matrix.function)) != ''
        run: composer test:unit

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: sites/app/.nvmrc
          cache: npm
          cache-dependency-path: sites/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instruções só no AGENTS.md e skills só em .agents/skills
        run: |
          forbidden=$(git ls-files 'CLAUDE.md' '**/CLAUDE.md' '.cursorrules' 'GEMINI.md' '.github/copilot-instructions.md')
          stray_skills=$(git ls-files '**/SKILL.md' | grep -v '^\.agents/skills/' || true)
          if [ -n "$forbidden$stray_skills" ]; then
            echo "Arquivos fora do padrão de agentes:"
            echo "$forbidden"
            echo "$stray_skills"
            exit 1
          fi

  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [functions, site, agents]
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.event_name == 'workflow_dispatch' && 'dev' || 'prod' }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && 'dev' || 'prod' }}
      APPWRITE_ENDPOINT: https://overmaker.overclk.tech/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: sites/app/.nvmrc
      - run: npm install --global appwrite-cli@28.9.0

      - name: Projeto
        env:
          KEY_DEV: ${{ secrets.APPWRITE_API_KEY_DEV }}
          KEY_PROD: ${{ secrets.APPWRITE_API_KEY_PROD }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          dev=$(jq -r .projectId appwrite.config.json)
          case "$dev" in
            *-dev) ;;
            *) echo "::error::O projectId do appwrite.config.json ('$dev') precisa terminar em -dev."; exit 1 ;;
          esac
          if [ "$TARGET" = prod ]; then
            project="${dev%-dev}-prod" key="$KEY_PROD" site="$SITE_URL"
          else
            project="$dev" key="$KEY_DEV" site="https://$dev.app.overclk.tech"
          fi
          if [ -z "$key" ] || [ -z "$site" ]; then
            echo "::error::Falta o segredo APPWRITE_API_KEY_${TARGET^^} ou a variável SITE_URL no repositório."
            exit 1
          fi
          jq --arg id "$project" '.projectId = $id' appwrite.config.json > appwrite.deploy.json
          mv appwrite.deploy.json appwrite.config.json
          appwrite client --endpoint "$APPWRITE_ENDPOINT" --key "$key"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          echo "SITE=$site" >> "$GITHUB_ENV"
          echo "Publicando $GITHUB_REF_NAME em $project ($site)"

      - name: Esquema
        run: |
          if jq -e '(.teams // []) | length > 0' appwrite.config.json > /dev/null; then
            appwrite push team --all --force
          fi
          appwrite push table --all --force

      - name: Functions
        run: appwrite push function --all --activate --force

      - name: Site
        run: |
          printf 'NUXT_PUBLIC_APPWRITE_ENDPOINT=%s\nNUXT_PUBLIC_APPWRITE_PROJECT_ID=%s\n' \
            "$APPWRITE_ENDPOINT" "$PROJECT" > sites/app/.env
          appwrite push site --all --activate --with-variables --force

      - name: Teste de fumaça
        run: curl --fail --silent --show-error --output /dev/null --retry 5 --retry-delay 10 "$SITE/login"
